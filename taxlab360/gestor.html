<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Usuarios | TAXLAB 360</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="sesion.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Roboto',sans-serif;background:#F1F5F9;color:#1E293B}
  header{background:#004B91;color:#fff;padding:14px 26px;display:flex;align-items:center;gap:14px;
         box-shadow:0 2px 10px rgba(0,0,0,.2)}
  header h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.5px}
  header .sp{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
  header a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:7px 14px;
           border-radius:6px;font-weight:600;font-size:13px}
  .wrap{max-width:1180px;margin:22px auto;padding:0 18px}
  .card{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:20px;overflow:hidden}
  .card h2{margin:0;padding:14px 20px;font-size:15px;background:#1E395B;color:#fff;font-weight:700;
           display:flex;align-items:center;gap:10px}
  .card .body{padding:18px 20px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{background:#E2E8F0;text-align:left;padding:9px 12px;font-weight:700;font-size:12.5px;
     text-transform:uppercase;letter-spacing:.3px;color:#475569}
  td{padding:9px 12px;border-bottom:1px solid #E9EEF5;vertical-align:middle}
  tr:hover td{background:#F8FAFC}
  .chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700}
  .r-MASTER{background:#7C3AED;color:#fff}.r-DOCENTE{background:#0369A1;color:#fff}
  .r-PRO{background:#0891B2;color:#fff}.r-ASISTENTE{background:#0D9488;color:#fff}
  .r-ESTUDIANTE{background:#16A34A;color:#fff}.r-PRUEBA{background:#B45309;color:#fff}
  .r-INVITADO{background:#94A3B8;color:#fff}
  button,select,input{font-family:'Roboto',sans-serif;font-size:13.5px}
  .btn{border:none;border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600;color:#fff}
  .btn-p{background:#004B91}.btn-w{background:#B45309}.btn-d{background:#B91C1C}.btn-s{background:#0F766E}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  input[type=text],input[type=password],select{padding:8px 11px;border:1px solid #CBD5E1;border-radius:6px}
  .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .aviso{padding:11px 16px;border-radius:8px;font-size:13.5px;margin-bottom:14px;display:none}
  .ok{background:#DCFCE7;color:#166534;border:1px solid #86EFAC}
  .err{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}
  .vacio{padding:26px;text-align:center;color:#64748B;font-size:14px}
  .mini{font-size:11.5px;color:#64748B}
  .codigo{font-family:monospace;background:#0F172A;color:#67E8F9;padding:3px 9px;border-radius:5px;
          font-size:13px;letter-spacing:1px}
</style>
</head>
<body>
<header>
  <i class="fas fa-users-cog" style="font-size:22px"></i>
  <h1>GESTOR DE USUARIOS</h1>
  <div class="sp">
    <span id="quien"></span>
    <a href="index.html"><i class="fas fa-arrow-left"></i> Volver</a>
  </div>
</header>

<div class="wrap">
  <div id="aviso" class="aviso"></div>

  <!-- ======================= SECCIONES ======================= -->
  <div class="card">
    <h2><i class="fas fa-chalkboard"></i> Mis secciones</h2>
    <div class="body">
      <div class="fila">
        <input type="text" id="s-nombre" placeholder="Nombre de la sección (ej. Grupo A)" style="min-width:230px">
        <input type="text" id="s-curso"  placeholder="Curso" style="min-width:200px">
        <input type="text" id="s-ciclo"  placeholder="Ciclo (2026-I)" style="width:130px">
        <button class="btn btn-p" onclick="crearSeccion()"><i class="fas fa-plus"></i> Crear sección</button>
      </div>
      <div id="tabla-secciones"></div>
    </div>
  </div>

  <!-- ======================= MATRICULAR ======================= -->
  <div class="card">
    <h2><i class="fas fa-user-plus"></i> Matricular estudiante</h2>
    <div class="body">
      <div class="fila">
        <select id="m-seccion" style="min-width:260px"></select>
        <input type="text" id="m-usuario" placeholder="Nombre de usuario del alumno" style="min-width:240px">
        <button class="btn btn-s" onclick="matricular()"><i class="fas fa-check"></i> Matricular</button>
        <span class="mini">Al matricularlo pasa de INVITADO a ESTUDIANTE automáticamente.</span>
      </div>
    </div>
  </div>

  <!-- ======================= USUARIOS ======================= -->
  <div class="card">
    <h2><i class="fas fa-user-friends"></i> Usuarios</h2>
    <div class="body">
      <div class="fila">
        <input type="text" id="q" placeholder="Buscar por usuario o nombre..." style="min-width:280px"
               onkeydown="if(event.key==='Enter')cargarUsuarios()">
        <button class="btn btn-p" onclick="cargarUsuarios()"><i class="fas fa-search"></i> Buscar</button>
        <button class="btn btn-p" onclick="document.getElementById('q').value='';cargarUsuarios()">
          <i class="fas fa-list"></i> Ver todos</button>
        <span style="margin-left:auto" class="mini">
          Reiniciar borra el avance, las declaraciones y los movimientos del alumno.</span>
      </div>
      <div class="fila">
        <label class="mini">Reiniciar solo la empresa:</label>
        <select id="r-empresa" style="min-width:330px"><option value="">Todas las empresas</option></select>
      </div>
      <div id="tabla-usuarios"></div>
    </div>
  </div>
</div>

<script src="gestor.js"></script>
</body>
</html>
